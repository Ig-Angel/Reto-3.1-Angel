<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reto 3.1. Angel</title>
    <meta name="description" content="Modern interface for managing customers through our REST API.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --bg: #f7fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --success: #22c55e;
            --danger: #ef4444;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 0.25rem;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 1.5rem;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
        }

        h2 {
            margin-bottom: 1.25rem;
            font-size: 1.1rem;
            color: var(--text);
            border-bottom: 2px solid var(--bg);
            padding-bottom: 0.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.4rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 0.6rem 0.8rem;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text);
            outline: none;
            font-size: 0.9rem;
        }

        input:focus {
            border-color: var(--primary);
        }

        .btn {
            width: 100%;
            padding: 0.7rem;
            border-radius: 4px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .client-item {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 1rem;
            margin-bottom: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .client-info h3 {
            font-size: 1rem;
            margin-bottom: 0.1rem;
        }

        .client-info p {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .client-actions {
            display: flex;
            gap: 0.4rem;
        }

        .btn-icon {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
            cursor: pointer;
            background: #fff;
            color: var(--text-muted);
        }

        .btn-edit:hover {
            background: #eff6ff;
            color: var(--primary);
            border-color: var(--primary);
        }

        .btn-delete:hover {
            background: #fef2f2;
            color: var(--danger);
            border-color: var(--danger);
        }

        #toast {
            position: fixed;
            top: 1rem;
            right: 1rem;
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            background: white;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            color: var(--text);
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        #toast.show {
            opacity: 1;
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .loader {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <header>
        <h1>Angel mola mucho</h1>
    </header>

    <main class="container">
        <!-- Dashboard Section: Create/Edit -->
        <section class="card-container">
            <div class="card" id="form-card">
                <h2 id="form-title">Nuevo Cliente</h2>
                <form id="customer-form">
                    <input type="hidden" id="customer-id">
                    <div class="form-group">
                        <label for="nombre">Nombre Completo</label>
                        <input type="text" id="nombre" placeholder="Ej. Angel Lorenzo" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Correo</label>
                        <input type="email" id="email" placeholder="angel@angel.com" required>
                    </div>
                    <button type="submit" class="btn btn-primary" id="submit-btn">
                        <span id="btn-text">Guardar Cliente</span>
                        <div class="loader" id="loader"></div>
                    </button>
                    <button type="button" class="btn" id="cancel-btn" style="background: transparent; margin-top: 0.5rem; display: none;">
                        Cancelar Edición
                    </button>
                </form>
            </div>
        </section>

        <!-- List Section -->
        <section class="card">
            <h2>Clientes de la BBDD</h2>
            <div id="clients-container" class="client-list">
                <!-- Data will be loaded here -->
                <div class="empty-state">Cargando...</div>
            </div>
        </section>
    </main>

    <div id="toast">Operación realizada</div>

    <script>
        const form = document.getElementById('customer-form');
        const container = document.getElementById('clients-container');
        const submitBtn = document.getElementById('submit-btn');
        const loader = document.getElementById('loader');
        const btnText = document.getElementById('btn-text');
        const toast = document.getElementById('toast');
        const cancelBtn = document.getElementById('cancel-btn');
        const formTitle = document.getElementById('form-title');

        let isEditing = false;

        // Fetch all clients
        async function fetchClients() {
            try {
                const response = await fetch('clientes/seleccionar.php');
                const data = await response.json();
                
                renderClients(data.records || []);
            } catch (error) {
                console.error('Error fetching clients:', error);
                container.innerHTML = '<div class="empty-state" style="color: var(--danger)">Error al cargar datos. Verifica la base de datos.</div>';
            }
        }

        function renderClients(clients) {
            if (clients.length === 0) {
                container.innerHTML = '<div class="empty-state">No hay clientes registrados en la base de datos.</div>';
                return;
            }

            container.innerHTML = clients.map((client, index) => `
                <div class="client-item" style="animation-delay: ${index * 0.1}s">
                    <div class="client-info">
                        <h3>${client.nombre}</h3>
                        <p>${client.email}</p>
                    </div>
                    <div class="client-actions">
                        <button class="btn-icon btn-edit" title="Editar" onclick='editClient(${JSON.stringify(client)})'>
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                        </button>
                        <button class="btn-icon btn-delete" title="Borrar" onclick="deleteClient(${client.id})">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Handle Form Submission
        form.onsubmit = async (e) => {
            e.preventDefault();
            
            const id = document.getElementById('customer-id').value;
            const nombre = document.getElementById('nombre').value;
            const email = document.getElementById('email').value;

            setLoading(true);

            try {
                let url = isEditing ? `clientes/editar.php?id=${id}` : 'clientes/nuevo.php';
                
                // Form Data for PHP
                const formData = new FormData();
                formData.append('nombre', nombre);
                formData.append('email', email);

                const response = await fetch(url, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                
                if (response.ok) {
                    showToast(isEditing ? 'Cliente actualizado' : 'Cliente guardado');
                    resetForm();
                    fetchClients();
                } else {
                    showToast(result.message || 'Error en la operación', true);
                }
            } catch (error) {
                showToast('Error de conexión', true);
            } finally {
                setLoading(false);
            }
        };

        // Delete Client
        async function deleteClient(id) {
            if (!confirm('¿Estás seguro de borrar este cliente?')) return;

            try {
                const response = await fetch(`clientes/borrar.php?id=${id}`);
                const result = await response.json();

                if (response.ok) {
                    showToast('Cliente eliminado');
                    fetchClients();
                } else {
                    showToast(result.message || 'Error al eliminar', true);
                }
            } catch (error) {
                showToast('Error de conexión', true);
            }
        }

        // UI Helpers
        function editClient(client) {
            isEditing = true;
            document.getElementById('customer-id').value = client.id;
            document.getElementById('nombre').value = client.nombre;
            document.getElementById('email').value = client.email;
            
            formTitle.innerText = 'Editar Cliente';
            btnText.innerText = 'Actualizar Datos';
            cancelBtn.style.display = 'flex';
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            isEditing = false;
            form.reset();
            document.getElementById('customer-id').value = '';
            formTitle.innerText = 'Nuevo Cliente';
            btnText.innerText = 'Guardar Cliente';
            cancelBtn.style.display = 'none';
        }

        cancelBtn.onclick = resetForm;

        function setLoading(state) {
            submitBtn.disabled = state;
            loader.style.display = state ? 'block' : 'none';
            btnText.style.display = state ? 'none' : 'block';
        }

        function showToast(message, error = false) {
            toast.innerText = message;
            toast.style.borderColor = error ? 'var(--danger)' : 'var(--primary)';
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Initial load
        window.onload = fetchClients;
    </script>
</body>
</html>
